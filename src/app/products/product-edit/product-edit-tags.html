<form class="slide-panel space-y-6 p-6" novalidate autocomplete="off">
  <!-- Image URL -->
  <div>
    <label for="imageUrl" class="mb-2 block text-sm font-medium text-slate-700">
      Image URL
    </label>

    <input id="imageUrl" type="url" placeholder="https://example.com/image.png" [formField]="vm.productForm.imageUrl"
      class="input" />
  </div>

  <div>
    <label for="tags" class="mb-2 block text-sm font-medium text-slate-700">
      Tags
    </label>

    <app-tag-input label="Search Tags" placeholder="Search keywords separated by commas" [(tags)]="vm.product().tags">
    </app-tag-input>

    <p class="mt-2 text-sm text-slate-500">
      Separate multiple tags with commas.
    </p>
  </div>
</form>
