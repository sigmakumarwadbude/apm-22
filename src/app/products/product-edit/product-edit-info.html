<form class="space-y-6 p-6" novalidate autocomplete="off">

    <!-- Product Name -->
    <div>
        <app-form-field label="Product Name" fieldId="productName">
            <input id="productName" [formField]="vm.productForm.productName" class="input" />
            <app-form-errors [field]="vm.productForm.productName" />
        </app-form-field>
    </div>

    <!-- Description -->
    <div>
        <app-form-field label="Description" fieldId="description">
            <textarea id="description" rows="4" placeholder="Enter product description"
                [formField]="vm.productForm.description" class="input">
            </textarea>
            <app-form-errors [field]="vm.productForm.description" />
        </app-form-field>

    </div>

    <!-- Release Date & Product Code (side by side) -->
    <div class="grid grid-cols-2 gap-4">
        <!-- Release Date -->
        <div>
            <app-form-field label="Release Date" fieldId="releaseDate">
                <input id="releaseDate" [formField]="vm.productForm.releaseDate" class="input" type="date" />
                <app-form-errors [field]="vm.productForm.releaseDate" />
            </app-form-field>
        </div>

        <!-- Product Code -->
        <div>
            <app-form-field label="Product Code" fieldId="productCode">
                <input id="productCode" type="text" placeholder="Enter product code"
                    [formField]="vm.productForm.productCode" class="input" />
                <app-form-errors [field]="vm.productForm.productCode" />
            </app-form-field>
        </div>
    </div>

    <!-- Price & Star Rating (side by side) -->
    <div class="grid grid-cols-2 gap-4">

        <!-- Price -->
        <div>
            <app-form-field label="Price ($)" fieldId="price">
                <input id="price" type="number" step="0.01" placeholder="0.00" [formField]="vm.productForm.price"
                    class="input" />
                <app-form-errors [field]="vm.productForm.price" />
            </app-form-field>
        </div>

        <!-- Star Rating -->
        <div>
            <app-form-field label="Star Rating (1–5)" fieldId="starRating">
                <input id="starRating" type="number" step="0.5" placeholder="1–5"
                    [formField]="vm.productForm.starRating" class="input" />
                <app-form-errors [field]="vm.productForm.starRating" />
            </app-form-field>
        </div>
    </div>
</form>
