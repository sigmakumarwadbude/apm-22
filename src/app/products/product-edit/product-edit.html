<div class="mx-auto max-w-4xl rounded-xl bg-white shadow-lg">
  <!-- Header -->
  <div class="border-b border-slate-200 px-6 py-4">
    <h2 class="text-2xl font-semibold text-slate-800">
      {{ pageTitle() }}
    </h2>
  </div>

  <div class="w-full">
    <nav class="flex border-b border-slate-200 px-6 overflow-visible">
      <button routerLink="info" routerLinkActive="tab-active" class="wizard-step">
        Product Info
      </button>

      <button routerLink="tags" routerLinkActive="tab-active" class="wizard-step">
        Product Tags
      </button>
    </nav>

    <div class="p-6">
      <router-outlet />
    </div>
  </div>

  <div class="flex flex-wrap gap-3 pt-2">

    <button type="button" (click)="saveProduct()" [disabled]="productForm().invalid()" class="rounded-lg bg-blue-600 px-5 py-2 text-white transition
               hover:bg-blue-700
               disabled:cursor-not-allowed
               disabled:opacity-50">
      Save
    </button>

    <button type="button" (click)="cancel()"
      class="rounded-lg border border-slate-300 px-5 py-2 text-slate-700 transition hover:bg-slate-100">
      Cancel
    </button>
    @if (product().productId > 0) {
    <button type="button" (click)="deleteProduct()"
      class="rounded-lg bg-red-600 px-5 py-2 text-white transition hover:bg-red-700">
      Delete
    </button>
    }
  </div>
</div>

@if(errorMessage()) {
<div class="mt-6 rounded-lg border border-red-200 bg-red-50 p-4 text-red-700">
  {{ errorMessage() }}
</div>
}
