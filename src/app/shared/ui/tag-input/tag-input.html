<label class="mb-2 block font-medium">

    {{ label() }}

</label>

<div class="flex gap-3">

    <input
        #tagInput
        class="flex-1 rounded border px-3 py-2"
        [value]="value()"
        (input)="value.set(tagInput.value)"
        (keyup.enter)="addTag()"
        [placeholder]="placeholder()" />

    <button
        type="button"
        (click)="addTag()"
        class="rounded border border-blue-600 px-4 py-2 text-blue-600">

        Add

    </button>

</div>

<div class="mt-4 flex flex-wrap gap-2">

    @for (tag of tags(); track tag) {

        <span
            class="inline-flex items-center rounded border
                   bg-slate-100 px-3 py-1">

            {{ tag }}

            <button
                type="button"
                class="ml-2 text-slate-500 hover:text-red-600"
                (click)="removeTag(tag)">
                ×

            </button>

        </span>

    }

</div>
